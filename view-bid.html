<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>American Legacy Glass — Bid Approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Web3Forms sends the acceptance notification email — no library needed, just a direct request -->
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #171717;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
    --accent: #ffffff;
    --green: #7ed4a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .wrap { width: 100%; max-width: 600px; }
  .logo-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.05em; text-align: center; margin-bottom: 0.25rem; }
  .logo-sub { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 2rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.25rem; }
  .card-label { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
  .row { display: flex; justify-content: space-between; padding: 0.4rem 0; font-size: 0.9rem; }
  .row.total { border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.75rem; font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; }
  .piece-line { display: flex; justify-content: space-between; padding: 0.35rem 0; font-size: 0.85rem; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,0.04); }
  .piece-line span:first-child { color: var(--text); }
  .btn-approve {
    width: 100%; background: var(--green); border: none; border-radius: 10px; color: #0a1f14;
    cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.05em;
    padding: 1rem; transition: all 0.15s;
  }
  .btn-approve:hover { background: #8fe0b3; }
  .btn-approve:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .status-msg { text-align: center; padding: 2rem 1rem; }
  .status-msg .icon { font-size: 3rem; margin-bottom: 0.75rem; }
  .status-msg .title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; margin-bottom: 0.5rem; }
  .status-msg .sub { color: var(--muted); font-size: 0.9rem; }
  .loading { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .fine-print { text-align: center; font-size: 0.72rem; color: var(--muted); margin-top: 1rem; line-height: 1.5; }
  .page-footer { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
  .page-footer a { color: var(--text); text-decoration: none; }
  .page-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo-title">AMERICAN LEGACY <span style="color:var(--green)">GLASS</span></div>
  <div class="logo-sub">Bid Approval</div>

  <div id="content">
    <div class="loading">Loading your bid…</div>
  </div>

  <div class="page-footer">
    Questions? Call <a href="tel:4804428121">480-442-8121</a> or email <a href="mailto:americanlegacyglass@gmail.com">americanlegacyglass@gmail.com</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, runTransaction } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCA4Fk7aLGnrd5U2T0-dmbrr6BimVC1TK8",
    authDomain: "glass-bidding-and-invoicing.firebaseapp.com",
    projectId: "glass-bidding-and-invoicing",
    storageBucket: "glass-bidding-and-invoicing.firebasestorage.app",
    messagingSenderId: "849136314530",
    appId: "1:849136314530:web:91f69219a4096a61428ffb"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ── Web3Forms setup — sign up free at https://web3forms.com (just verify an
  // email, no login needed) and paste your Access Key below. Unlike EmailJS, the
  // free plan has no domain-restriction paywall.
  const WEB3FORMS_ACCESS_KEY = 'cc74c432-5567-46e2-9c05-56b505e5b126';

  const params = new URLSearchParams(window.location.search);
  const bidId = params.get('id');
  const content = document.getElementById('content');

  function fmt(n) {
    const safe = isNaN(n) ? 0 : n;
    return '$' + safe.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // A network call that never resolves (a stalled connection, a Worker that
  // hangs) would otherwise leave the customer stuck on "Approving…" forever,
  // even though their approval already succeeded in Firestore moments
  // earlier. This forces any background call to give up after a few seconds
  // so the confirmation screen always eventually shows.
  async function fetchWithTimeout(url, options, timeoutMs = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  function showError(msg) {
    content.innerHTML = `<div class="status-msg"><div class="icon">⚠️</div><div class="title">${msg}</div></div>`;
  }

  function showApproved(job) {
    const depositRequired = job.depositRequired !== false; // matches the main app's default (ON unless explicitly turned off)
    const depositLines = depositRequired
      ? 'An invoice will follow shortly for the deposit. Production begins as soon as deposit is received. '
      : '';
    content.innerHTML = `
      <div class="status-msg">
        <div class="icon">✓</div>
        <div class="title" style="color:var(--green);">Bid Approved</div>
        <div class="sub">Thanks${job.customer ? ', ' + job.customer : ''}! ${depositLines}Once fabrication is complete our office will contact you to schedule installation.</div>
      </div>`;
  }

  async function loadBid() {
    if (!bidId) { showError('No bid specified'); return; }
    try {
      const snap = await getDoc(doc(db, 'jobs', bidId));
      if (!snap.exists()) { showError('Bid not found'); return; }
      const job = snap.data();

      if (job.status === 'accepted') {
        showApproved(job);
        return;
      }

      content.innerHTML = `
        <div class="card">
          <div class="card-label">Prepared For</div>
          <div style="font-size:1.1rem;font-weight:600;">${job.customer || 'Customer'}</div>
          ${job.jobDesc ? `<div style="color:var(--muted);font-size:0.85rem;margin-top:0.25rem;">${job.jobDesc}</div>` : ''}
        </div>
        <div class="card">
          <div class="row total">
            <span style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;">
              <span>Total</span>
              <span style="font-family:'DM Sans',sans-serif;text-transform:none;letter-spacing:normal;font-size:0.55rem;color:var(--muted);">(includes all materials and installation)</span>
            </span>
            <span>${fmt(job.total || 0)}</span>
          </div>
          ${job.depositRequired !== false ? `<div class="row" style="color:var(--muted);font-size:0.8rem;">50% deposit required to begin production</div>` : ''}
        </div>
        <button class="btn-approve" id="approveBtn">✓ Approve Bid Now</button>
        <div class="fine-print">By approving, you authorize American Legacy Glass to proceed with the work described above at the price quoted.</div>
      `;

      document.getElementById('approveBtn').addEventListener('click', () => approveBid(job));
    } catch (err) {
      console.error('Bid load error:', err);
      // Show the real reason on screen (not just in the console) so it's easy to
      // diagnose without needing dev tools — usually a Firestore permissions issue
      // if the rules haven't been published yet, since that's the most common cause.
      const isPermissionError = err.code === 'permission-denied' || /permission/i.test(err.message||'');
      showError(isPermissionError
        ? 'Access denied — the Firestore rules update may not be published yet'
        : 'Could not load this bid (' + (err.message || 'unknown error') + ')');
    }
  }

  async function approveBid(job) {
    const btn = document.getElementById('approveBtn');
    btn.disabled = true;
    btn.textContent = 'Approving…';
    try {
      // Atomic check-and-set: guards against two tabs/devices (or a double-tap
      // that beats the disabled-button state) both racing to approve the same
      // bid before either write lands. Only the request that actually flips
      // status away from 'accepted' sends the notification email below —
      // a request that discovers it was already accepted just shows the
      // approved screen and stops, no duplicate email.
      const jobRef = doc(db, 'jobs', bidId);
      const result = await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(jobRef);
        if (!snap.exists()) throw new Error('Bid not found');
        const current = snap.data();
        if (current.status === 'accepted') {
          return { alreadyAccepted: true, job: current };
        }
        transaction.update(jobRef, {
          status: 'accepted',
          acceptedAt: new Date().toISOString(),
        });
        return { alreadyAccepted: false, job: current };
      });

      if (result.alreadyAccepted) {
        showApproved(result.job);
        return;
      }
      job = result.job;

      // Notify the shop by email via Web3Forms — a simple POST request, no library needed
      console.log('About to attempt email send. Web3Forms configured?', WEB3FORMS_ACCESS_KEY !== 'YOUR_ACCESS_KEY');
      if (WEB3FORMS_ACCESS_KEY !== 'YOUR_ACCESS_KEY') {
        try {
          const emailRes = await fetchWithTimeout('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              access_key: WEB3FORMS_ACCESS_KEY,
              subject: '✓ Bid Approved — ' + (job.customer || 'Unknown') + ' (' + fmt(job.total || 0) + ')',
              email: 'americanlegacyglass@gmail.com', // "from" shown in the notification, not the recipient
              message: 'A customer just approved a bid through the online link.\n\n' +
                'Customer: ' + (job.customer || 'Unknown') + '\n' +
                'Job: ' + (job.jobDesc || '') + '\n' +
                'Total: ' + fmt(job.total || 0) + '\n' +
                'Bid ID: ' + bidId + '\n\n' +
                'Reach out to schedule the work.',
            }),
          });
          const emailResult = await emailRes.json();
          console.log('Web3Forms response:', emailResult);
          if (!emailResult.success) console.error('Web3Forms reported failure:', emailResult.message);
        } catch (emailErr) {
          // The approval itself already succeeded (see above) — this only means the
          // notification email failed. Logged here for diagnosis, doesn't block approval.
          console.error('Email notification FAILED. Full error below:', emailErr);
        }
      } else {
        console.warn('Web3Forms not configured — skipping notification email');
      }

      // Automatically create the Xero invoice. Wrapped separately from the
      // approval itself — the customer's approval already succeeded and is
      // the thing that matters to them; if Xero invoicing fails here, ALG
      // gets alerted by the Worker itself, but the customer still just sees
      // a normal successful approval rather than an error about bookkeeping
      // they have no part in.
      try {
        const invRes = await fetchWithTimeout('https://morning-frost-ce94.rdenmyers1201.workers.dev/create-xero-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobId: bidId }),
        });
        const invData = await invRes.json();
        console.log('Xero invoice creation:', invData);
      } catch (invErr) {
        console.error('Xero invoice creation FAILED. Full error below:', invErr);
      }

      showApproved(job);
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = '✓ Approve Bid Now';
      alert('Something went wrong approving this bid. Please try again or call us directly.');
    }
  }

  loadBid();
</script>
</body>
</html>
